spring.application.name=outthere
# Optional local KEY=value configuration, read when starting from backend/.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/outthere}
spring.datasource.username=${DB_USERNAME:outthere}
spring.datasource.password=${DB_PASSWORD:outthere}

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081}

# HS256 signing key (at least 32 bytes). The default is for local development only;
# every shared or production deployment must set JWT_SECRET.
app.auth.jwt-secret=${JWT_SECRET:local-dev-only-outthere-jwt-secret-change-me}
app.auth.signup-bonus-coins=500

# Course vectors are generated only when a server-side key is present.
app.recommendations.api-key=${OPENAI_API_KEY:}
app.recommendations.embedding-model=${EMBEDDING_MODEL:text-embedding-3-small}
app.recommendations.worker-enabled=${EMBEDDING_WORKER_ENABLED:true}
app.recommendations.worker-delay-ms=2000
spring.task.scheduling.pool.size=2

# On-demand course creation; no model/geocoding calls until explicitly requested.
app.generation.api-key=${OPENAI_API_KEY:}
app.generation.model=${COURSE_GENERATION_MODEL:gpt-4.1-mini}
app.generation.worker-delay-ms=2000
# Nominatim-compatible, self-hosted or contracted endpoint; no public-service default.
app.generation.geocoder-url=${GEOCODER_URL:}
app.generation.geocoder-user-agent=${GEOCODER_USER_AGENT:OutThere/1.0}
app.generation.geocoder-api-key=${GEOCODER_API_KEY:}
app.generation.geocoder-auth-mode=${GEOCODER_AUTH_MODE:header}
app.generation.geocoder-min-interval-ms=${GEOCODER_MIN_INTERVAL_MS:1000}

# Retrieved photographs; no synthesized images or model-invented URLs.
app.images.api-key=${OPENAI_API_KEY:}
app.images.model=${COVER_IMAGE_MODEL:gpt-4.1-mini}
app.images.commons-url=${COMMONS_API_URL:https://commons.wikimedia.org}
app.images.user-agent=${IMAGE_SEARCH_USER_AGENT:OutThereCourseImages/1.0 (educational course covers)}
app.images.worker-enabled=${COVER_IMAGE_WORKER_ENABLED:true}
app.images.worker-delay-ms=2000

services:
  postgres:
    image: postgres:16
    container_name: outthere-postgres
    environment:
      POSTGRES_DB: outthere
      POSTGRES_USER: outthere
      POSTGRES_PASSWORD: outthere
    ports:
      - "5432:5432"
    volumes:
      - outthere-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outthere -d outthere"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  outthere-postgres-data:
